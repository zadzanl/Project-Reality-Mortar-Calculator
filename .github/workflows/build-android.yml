name: Build Android APK

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-android:
    name: Build Android APK
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for speed
          lfs: false  # LFS disabled - compressed files are small enough for regular Git

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm install

      - name: Verify processed maps exist
        run: |
          echo "Checking processed maps..."
          python3 -c "import os; maps = len([d for d in os.listdir('processed_maps') if os.path.isdir(os.path.join('processed_maps', d))]); print(f'Found {maps} processed maps'); exit(0 if maps > 0 else 1)"

      - name: Prepare web assets
        run: |
          echo "Creating www directory..."
          mkdir -p www
          
          echo "Copying web assets..."
          cp -r calculator/static www/
          cp calculator/templates/index.html www/
          cp -r processed_maps www/
          cp mapsList.json www/
          
          echo "Web assets prepared successfully!"

      - name: Fix paths for offline use
        run: |
          echo "Fixing paths for offline operation..."
          
          # Fix HTML file
          sed -i 's|href="/static/|href="static/|g' www/index.html
          sed -i 's|src="/static/|src="static/|g' www/index.html
          sed -i 's|href="/favicon.ico"|href="favicon.ico"|g' www/index.html
          
          # Fix JavaScript files
          sed -i "s|'/maps/list'|'mapsList.json'|g" www/static/js/app.js
          sed -i 's|`/maps/${|`processed_maps/${|g' www/static/js/app.js
          sed -i "s|'/static/lib/images/|'static/lib/images/|g" www/static/js/app.js
          sed -i 's|`/maps/${mapName}/|`processed_maps/${mapName}/|g' www/static/js/heightmap.js
          sed -i 's|/maps/\[mapName\]/|processed_maps/\[mapName\]/|g' www/static/js/heightmap.js
          
          echo "Paths updated successfully!"

      - name: Sync with Capacitor
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK was created
        run: |
          if [ -f android/app/build/outputs/apk/debug/pr-mortar-calc-debug.apk ]; then
            echo "✓ APK created successfully"
            ls -lh android/app/build/outputs/apk/debug/pr-mortar-calc-debug.apk
          else
            echo "✗ APK not found!"
            exit 1
          fi

      - name: Rename APK with version
        run: |
          cd android/app/build/outputs/apk/debug
          VERSION="$VERSION_INPUT"
          mv pr-mortar-calc-debug.apk "PR-Mortar-Calculator-Android-${VERSION}.apk"
          ls -lh "PR-Mortar-Calculator-Android-${VERSION}.apk"
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PR-Mortar-Calculator-Android
          path: android/app/build/outputs/apk/debug/PR-Mortar-Calculator-Android-*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Calculate APK size
        id: apk-size
        run: |
          VERSION="$VERSION_INPUT"
          APK_SIZE=$(du -h "android/app/build/outputs/apk/debug/PR-Mortar-Calculator-Android-${VERSION}.apk" | cut -f1)
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $APK_SIZE"
        env:
          VERSION_INPUT: ${{ inputs.version }}

  create-android-release:
    name: Create Android GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PR-Mortar-Calculator-Android
          path: release-artifacts

      - name: Display artifact structure
        run: |
          ls -R release-artifacts

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/PR-Mortar-Calculator-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Android APK Released Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download:" >> $GITHUB_STEP_SUMMARY
          echo "- **Android APK:** \`PR-Mortar-Calculator-Android-${{ inputs.version }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK file" >> $GITHUB_STEP_SUMMARY
          echo "2. Enable 'Install from Unknown Sources' in Android settings" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the APK file on your Android device" >> $GITHUB_STEP_SUMMARY
          echo "4. Tap 'Install'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Requirements:** Android 6.0 (API 23) or higher" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
