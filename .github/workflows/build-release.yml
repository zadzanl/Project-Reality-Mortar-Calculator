name: Build and Release

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

# Deny all permissions by default; grant per-job
permissions: {}

jobs:
  # ── PC Builds (Windows + Linux) ──────────────────────────────────────
  build-pc:
    name: Build PC on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            artifact_name: PR-Mortar-Calculator-Windows
            exe_extension: .exe
          - os: ubuntu-latest
            platform: Linux
            artifact_name: PR-Mortar-Calculator-Linux
            exe_extension: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for speed
          lfs: false  # LFS disabled - compressed files are small enough for regular Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify LFS files downloaded
        run: |
          python -c "import os, sys; size = os.path.getsize('processed_maps/adak/heightmap.json.gz'); print(f'heightmap.json.gz size: {size} bytes'); sys.exit(0 if size > 100000 else 1)"
        shell: bash

      - name: Verify processed maps exist
        run: |
          echo "Checking processed maps..."
          python -c "import os; maps = len([d for d in os.listdir('processed_maps') if os.path.isdir(os.path.join('processed_maps', d))]); print(f'Found {maps} processed maps'); exit(0 if maps > 0 else 1)"
        shell: bash

      - name: Verify contour maps exist
        run: |
          echo "Checking contour maps..."
          python -c "
          import os
          maps_dir = 'processed_maps'
          total = 0
          with_contour = 0
          for d in os.listdir(maps_dir):
              map_path = os.path.join(maps_dir, d)
              if os.path.isdir(map_path):
                  total += 1
                  if os.path.exists(os.path.join(map_path, 'contourmap.png')):
                      with_contour += 1
          print(f'Contour maps: {with_contour}/{total}')
          if with_contour == 0:
              print('WARNING: No contour maps found!')
              exit(1)
          "
        shell: bash

      - name: Build executable with PyInstaller
        run: |
          pyinstaller PR-Mortar-Calculator.spec

      - name: Create ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cd dist
          Write-Host "Creating ZIP archive..."
          Compress-Archive -Path 'PR-Mortar-Calculator' -DestinationPath '${{ matrix.artifact_name }}.zip' -CompressionLevel Optimal -Force
          cd ..

      - name: Create tar.gz (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          # Use maximum gzip compression (level 9)
          tar --use-compress-program="gzip -9" -cf ${{ matrix.artifact_name }}.tar.gz PR-Mortar-Calculator/
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ── Android Build ────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for speed
          lfs: false  # LFS disabled - compressed files are small enough for regular Git

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node.js version
        run: |
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
          echo "npx: $(npx --version)"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Verify critical assets
        run: |
          if [ ! -f calculator/static/lib/pako.min.js ]; then
            echo "Error: pako.min.js not found!"
            exit 1
          fi

      - name: Verify processed maps exist
        run: |
          echo "Checking processed maps..."
          python3 -c "import os; maps = len([d for d in os.listdir('processed_maps') if os.path.isdir(os.path.join('processed_maps', d))]); print(f'Found {maps} processed maps'); exit(0 if maps > 0 else 1)"

      - name: Prepare web assets
        run: |
          echo "Creating www directory..."
          mkdir -p www
          
          echo "Copying web assets..."
          cp -r calculator/static www/
          cp calculator/templates/index.html www/
          cp -r processed_maps www/
          cp mapsList.json www/

          # Android aapt strips the `.gz` extension from packaged assets.
          # To keep heightmaps compressed in the APK, rename *.gz -> *.gzip in www/.
          echo "Renaming compressed heightmaps for Android packaging..."
          find www/processed_maps -type f -name '*.gz' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "${f%.gz}.gzip"
          done
          
          echo "Web assets prepared successfully!"

      - name: Fix paths for offline use
        run: |
          echo "Fixing paths for offline operation..."
          
          # Fix HTML file
          sed -i 's|href="/static/|href="static/|g' www/index.html
          sed -i 's|src="/static/|src="static/|g' www/index.html
          sed -i 's|href="/favicon.ico"|href="favicon.ico"|g' www/index.html
          
          # Fix JavaScript files
          sed -i "s|'/maps/list'|'mapsList.json'|g" www/static/js/app.js
          sed -i 's|`/maps/${|`processed_maps/${|g' www/static/js/app.js
          sed -i "s|'/static/lib/images/|'static/lib/images/|g" www/static/js/app.js
          sed -i 's|`/maps/${mapName}/|`processed_maps/${mapName}/|g' www/static/js/heightmap.js
          sed -i 's|/maps/\[mapName\]/|processed_maps/\[mapName\]/|g' www/static/js/heightmap.js
          
          echo "Paths updated successfully!"

      - name: Sync with Capacitor
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Accept Android Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK was created
        run: |
          if [ -f android/app/build/outputs/apk/debug/pr-mortar-calc-debug.apk ]; then
            echo "✓ APK created successfully"
            ls -lh android/app/build/outputs/apk/debug/pr-mortar-calc-debug.apk
          else
            echo "✗ APK not found!"
            exit 1
          fi

      - name: Rename APK with version
        run: |
          cd android/app/build/outputs/apk/debug
          VERSION="$VERSION_INPUT"
          mv pr-mortar-calc-debug.apk "PR-Mortar-Calculator-Android-${VERSION}.apk"
          ls -lh "PR-Mortar-Calculator-Android-${VERSION}.apk"
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PR-Mortar-Calculator-Android
          path: android/app/build/outputs/apk/debug/PR-Mortar-Calculator-Android-*.apk
          retention-days: 90
          if-no-files-found: error

  # ── Unified Release ──────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-pc, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display artifact structure
        run: |
          ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Created Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloads:" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows (ZIP):** \`PR-Mortar-Calculator-Windows.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux:** \`PR-Mortar-Calculator-Linux.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android APK:** \`PR-Mortar-Calculator-Android-${{ inputs.version }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Android Installation:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK file" >> $GITHUB_STEP_SUMMARY
          echo "2. Enable 'Install from Unknown Sources' in Android settings" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the APK file on your Android device" >> $GITHUB_STEP_SUMMARY
          echo "4. Tap 'Install'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Android Requirements:** Android 6.0 (API 23) or higher" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
